[package]
name = "sodeck-docker"
version = "0.12.1"
edition = "2021"
publish = false

[dependencies]
sodeck-plugin-client = { path = "../../crates/plugin-client" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
vte = { version = "=0.15.0", default-features = false }
tempfile = "=3.27.0"

[profile.release]
strip = true
