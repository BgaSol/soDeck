<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Docker</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="style.css"></head>
<body>
<main id="app">
  <header><div class="heading"><h1 id="title">Docker</h1><span id="state">正在读取</span></div><div class="toolbar"><button id="refresh" type="button">刷新</button><button id="cancel" type="button" hidden>取消等待</button><button id="pause" type="button" hidden>暂停刷新</button></div></header>
  <p id="notice" role="status" hidden></p>
  <section id="engine-bar"><span id="engine-name">等待 Engine</span><span id="engine-version"></span><span id="endpoint" hidden></span></section>
  <p id="operation" role="status" hidden></p>
  <div id="scroll">
    <section id="browser" hidden>
      <div class="filters"><input id="query" type="search" aria-label="搜索容器" placeholder="搜索名称、镜像、标签或 ID" autocomplete="off"><nav id="status-tabs" aria-label="容器状态"><button data-status="running" type="button">运行</button><button data-status="all" type="button">全部</button><button data-status="abnormal" type="button">异常</button><button data-status="exited" type="button">停止</button><button data-status="paused" type="button">暂停</button></nav><input id="status-filter" type="hidden" value="running"><details id="filter-options"><summary>更多筛选</summary><label class="check">健康状态<select id="health-filter" aria-label="健康状态"><option value="all">全部</option><option value="healthy">健康</option><option value="unhealthy">不健康</option><option value="none">未配置</option></select></label><label class="check"><input id="group" type="checkbox">按 Compose 项目排列</label></details></div>
      <div id="list" role="list" aria-label="容器列表"></div><p id="empty" class="muted" hidden>没有符合条件的容器 <button id="clear-filters" type="button">清除筛选</button></p>
      <div class="paging"><button id="previous" type="button" disabled>上一页</button><span id="page-label"></span><button id="next" type="button" disabled>下一页</button></div>
    </section>
    <section id="container" hidden>
      <div class="identity"><span id="container-id"></span><button id="copy-id" type="button">复制 ID</button></div>
      <div id="actions" class="toolbar"><button data-operation="start">启动</button><button data-operation="stop">停止</button><button data-operation="restart">重启</button><button data-operation="pause">暂停</button><button data-operation="unpause">恢复</button><button data-operation="remove" class="danger">删除容器</button><button id="detail-logs">查看日志</button></div>
      <form id="terminal-form" class="toolbar"><label for="terminal-shell">容器 Shell</label><input id="terminal-shell" value="/bin/sh" spellcheck="false" autocomplete="off" required><button id="open-terminal" type="submit">打开终端</button></form>
      <p id="terminal-result" role="status" hidden></p>
      <section class="metrics"><div class="section-title"><h2>资源快照</h2><button id="read-stats" type="button">读取资源</button></div><p class="muted">按需读取 · 数值来自 Docker CLI，网络和块 I/O 为累计量。</p><dl id="stats"><dt>状态</dt><dd>尚未读取</dd></dl></section>
      <nav id="sections" aria-label="容器详情分区"></nav><label id="show-env-label" class="check" hidden><input id="show-env" type="checkbox">显示环境变量值</label><dl id="fields"></dl>
      <div class="paging"><button id="fields-prev" type="button" disabled>上一页</button><span id="fields-page"></span><button id="fields-next" type="button" disabled>下一页</button></div>
    </section>
    <section id="logs" hidden>
      <div class="log-toolbar"><label for="tail">最近行数</label><select id="tail"><option>50</option><option selected>200</option><option>500</option></select><label for="log-query">搜索当前快照</label><input id="log-query" type="search" placeholder="日志文本"><button id="copy-logs" type="button">复制当前页</button></div>
      <p class="muted">刷新替换最近日志快照；两路输出分别标记，不保证严格全局顺序。</p><pre id="log-content" tabindex="0" aria-label="最近容器日志"></pre>
      <div class="paging"><button id="logs-prev" type="button" disabled>上一页</button><span id="logs-page"></span><button id="logs-next" type="button" disabled>下一页</button></div>
    </section>
  </div>
  <details id="connection"><summary>连接设置</summary><form id="endpoint-form"><label for="socket">远端 Unix socket</label><input id="socket" type="text" spellcheck="false" autocomplete="off"><button type="submit">保存连接</button><p class="muted">Rootless Engine 请填写其实际 socket。客户端无需安装 Docker。</p></form></details>
  <footer><span id="count"></span><span id="freshness">等待首次采集</span><span id="busy"></span></footer>
  <div id="confirm-home" hidden><section id="confirm" aria-labelledby="confirm-title" hidden><form id="confirm-form"><h2 id="confirm-title">确认操作</h2><p id="confirm-object"></p><p id="confirm-impact"></p><div class="toolbar"><button id="confirm-cancel" type="button">取消</button><button id="confirm-submit" type="submit">确认</button></div></form></section></div>
</main>
<script src="bridge.js"></script><script src="text-menu.js"></script><script src="clipboard-bridge.js"></script><script src="view.js" type="module"></script>
</body>
</html>
