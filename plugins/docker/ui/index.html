<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Docker</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logs.css"></head>
<body class="browser-page">
<main id="app">
  <header><div class="heading"><h1 id="title">Docker</h1><span id="state" role="status">正在读取</span></div><div class="toolbar"><button id="refresh" type="button">刷新</button><button id="cancel" type="button" hidden>取消等待</button><button id="pause" type="button" hidden>暂停刷新</button><button id="browser-more" type="button" aria-label="Docker 更多操作" aria-haspopup="menu" aria-expanded="false" hidden>更多</button></div></header>
  <p id="notice" role="status" hidden></p>
  <section id="engine-bar"><span id="engine-name">等待 Engine</span><span id="engine-version"></span><span id="endpoint" hidden></span></section>
  <p id="operation" role="status" hidden></p>
  <div id="scroll">
    <section id="browser">
      <div class="filters"><div class="tree-search"><input id="query" type="search" aria-label="搜索 Docker 资源" placeholder="搜索容器、镜像、网络、卷" autocomplete="off" maxlength="1024"><details id="filter-options"><summary aria-label="容器筛选">筛选</summary><nav id="status-tabs" aria-label="容器状态"><button data-status="all" type="button">全部</button><button data-status="running" type="button">运行</button><button data-status="abnormal" type="button">异常</button><button data-status="exited" type="button">停止</button><button data-status="paused" type="button">暂停</button></nav><input id="status-filter" type="hidden" value="all"><label class="check">健康状态<select id="health-filter"><option value="all">全部</option><option value="healthy">健康</option><option value="unhealthy">不健康</option><option value="starting">检查中</option><option value="none">未配置</option></select></label><label class="check"><input id="group" type="checkbox" checked>Compose 项目分组</label><button id="clear-filters" type="button">清除筛选</button></details></div><button id="reveal-condition" type="button" hidden>临时显示目标 · 返回筛选</button></div>
      <div id="tree-viewport"><div id="resource-tree" role="tree" aria-label="Docker 资源树"></div></div>
    </section></div>
  <footer><span id="count"></span><span id="freshness">等待首次采集</span><span id="busy"></span></footer>
  <div id="inline-storage" hidden>  <section id="connection"><h2>连接设置</h2><form id="endpoint-form"><label for="connection-mode">连接方式</label><select id="connection-mode"><option value="auto">自动识别远端配置</option><option value="manual">手动指定端点</option></select><label id="socket-label" for="socket">远端 Docker 端点</label><input id="socket" type="text" spellcheck="false" autocomplete="off" placeholder="unix:///var/run/docker.sock 或 npipe:////./pipe/docker_engine"><label for="docker-cli">远端 Docker CLI 路径（可选）</label><input id="docker-cli" spellcheck="false" autocomplete="off" placeholder="留空按远端 PATH 查找"><div class="toolbar"><button id="connection-test" type="button">测试连接</button><button id="connection-save" type="submit">保存并连接</button><button id="connection-identify" type="button">重新识别</button><button id="connection-reset" type="button">撤销编辑</button></div><p id="connection-result" role="status"></p><pre id="connection-target"></pre><p class="muted">使用当前 SSH 账号访问远端 Docker；自动识别成功后固定实际端点。修改连接前请关闭该服务器的日志页。</p></form></section>      <section id="browser-tasks"><h2>任务与拉取结果</h2><p id="pull-status" role="status" hidden></p><button id="pull-cancel" type="button" hidden>取消拉取</button><pre id="pull-output" tabindex="0" aria-label="最近拉取命令输出" hidden></pre><div id="task-list"></div><div class="paging"><button id="task-prev" type="button" disabled>上一页</button><span id="task-page"></span><button id="task-next" type="button" disabled>下一页</button></div></section><section id="browser-panel" aria-label="对象操作" hidden></section></div>
  <div id="tree-menu" role="menu" aria-label="Docker 对象操作" hidden></div>
</main><script src="bridge.js"></script><script src="text-menu.js"></script><script src="clipboard-bridge.js"></script><script src="dom-update.js"></script><script type="module" src="browser.js"></script></body></html>
