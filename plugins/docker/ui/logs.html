<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>容器日志</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logs.css"></head><body class="logs-page"><main id="app"><header><div class="heading"><h1 id="title">容器日志</h1><span id="state" role="status"></span></div></header><div id="scroll">    <section id="logs" hidden>
      <p id="log-origin-label" class="log-origin-label"></p>
      <div class="log-tools">
        <select id="log-range" aria-label="日志时间范围"><option value="latest">最新</option><option value="900">过去15分钟</option><option value="3600">过去1小时</option><option value="86400">过去24小时</option><option value="custom">自定义时间</option></select>
        <div class="log-search"><input id="log-query" type="search" placeholder="搜索当前窗口" aria-label="搜索当前已读日志" autocomplete="off" maxlength="1024"><span id="log-matches"></span><button id="log-prev-match" title="上一处匹配" aria-label="上一处匹配">上一处</button><button id="log-next-match" title="下一处匹配" aria-label="下一处匹配">下一处</button></div>
        <details name="log-tools"><summary>筛选</summary><div class="log-options"><label>级别<select id="log-level"><option value="">全部</option><option value="unknown">未标注</option></select></label><label>来源<select id="log-source"><option value="">全部</option><option value="stdout">stdout</option><option value="stderr">stderr</option></select></label><label><input id="log-only" type="checkbox">只看匹配</label></div></details>
        <details name="log-tools"><summary>显示</summary><div class="log-options"><label><input id="log-wrap" type="checkbox" checked>自动换行</label><label><input id="log-map" type="checkbox" checked>右侧缩略</label><label><input id="log-show-source" type="checkbox">显示来源</label><button id="log-hold">保持当前位置</button></div></details>
        <details name="log-tools"><summary>更多</summary><div class="log-options"><button id="log-reload">重新读取</button><button id="log-complete">完整读取时间范围</button><button id="log-stop">停止读取</button><label><input id="log-export-one" type="checkbox">导出当前记录</label><label><input id="log-export-context" type="checkbox">包含前后10条</label><button id="log-export">导出当前结果</button></div></details>
      </div>
      <div id="log-conditions" class="log-conditions" hidden></div>
      <div id="log-custom" hidden><label>从 <input id="log-from" type="datetime-local"></label><label>至 <input id="log-to" type="datetime-local"></label><button id="log-read-custom" type="button">读取此范围</button></div>
      <p id="log-notice" role="status" hidden></p>
      <div id="log-main" class="log-main"><div id="log-viewport" class="log-viewport" tabindex="0" aria-label="容器日志正文"><button id="log-earlier" type="button">查看更早日志</button><p id="log-empty"></p><div id="log-lines"></div></div><aside id="log-detail" class="log-detail" hidden><div class="log-detail-header"><h2>日志详情</h2><button id="log-detail-close" aria-label="关闭日志详情">关闭</button></div><p id="log-detail-time"></p><div class="toolbar"><button id="log-copy">复制原文</button></div><pre id="log-detail-raw"></pre><details id="log-json" hidden><summary>结构化查看</summary><pre id="log-detail-json"></pre></details></aside></div>
      <div class="log-footer"><span id="log-status">等待读取</span><span id="log-scope">当前窗口</span><span id="log-coverage"></span><span id="log-export-progress" role="status"></span><button id="log-export-cancel" hidden>取消导出</button><button id="log-latest" hidden>查看最新</button></div>
    </section></div></main><script src="sdk/index.js"></script><script src="text-menu.js"></script><script src="sdk/clipboard.js"></script><script src="dom-update.js"></script><script type="module" src="logs-page.js"></script></body></html>
