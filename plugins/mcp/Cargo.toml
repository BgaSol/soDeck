[package]
name = "sodeck-mcp"
version = "0.13.0"
edition = "2021"
publish = false

[dependencies]
sodeck-plugin-client = { path = "../../crates/plugin-client" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
rand = "=0.10.4"
schemars = "=1.2.3"
jsonschema = { version = "=0.63.1", default-features = false }
tempfile = "=3.27.0"

[profile.release]
strip = true
