<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统状态</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
  <div class="toolbar"><span id="freshness">正在读取状态</span><div class="actions"><button id="refresh" type="button">刷新</button><button id="pause" type="button">暂停</button></div></div>
  <div id="scroll" class="scroll">
    <p id="notice" class="notice" role="status" hidden></p>
    <section aria-label="运行概况"><div class="metric-row"><span>CPU</span><strong id="cpu">采样中</strong></div><p id="cpu-caption" class="caption"></p><svg id="cpu-chart" class="chart" role="img" aria-label="CPU 最近五分钟趋势" viewBox="0 0 240 48"></svg><div class="metric-row"><span>内存</span><strong id="memory">正在读取</strong></div><p id="memory-caption" class="caption"></p><svg id="memory-chart" class="chart" role="img" aria-label="内存最近五分钟趋势" viewBox="0 0 240 48"></svg><details id="memory-details" hidden><summary>内存分类</summary><pre id="memory-source" class="caption"></pre></details><div class="metric-row"><span>运行时间</span><span id="uptime">正在读取</span></div><p id="load" class="caption"></p></section>
    <section aria-label="网络流量"><h2>网络</h2><label class="device-label" for="interface">网卡 / 计数器接口</label><select id="interface" aria-label="选择网络接口"></select><div class="rates"><div><span>接收</span><strong id="receive">采样中</strong></div><div><span>发送</span><strong id="send">采样中</strong></div></div><svg id="network-chart" class="chart" role="img" aria-label="接收流量最近五分钟趋势" viewBox="0 0 240 48"></svg><p id="network-note" class="caption"></p></section>
    <section aria-label="文件系统"><h2>文件系统</h2><p id="capacity-age" class="caption">正在读取容量</p><div id="filesystems"></div><div class="paging"><button id="previous" type="button" disabled>上一页</button><span id="page-label"></span><button id="next" type="button" disabled>下一页</button></div></section>
    <details id="disks"><summary>磁盘 I/O</summary><label class="device-label" for="disk">设备</label><select id="disk" aria-label="选择磁盘"></select><div class="rates"><div><span>读取</span><strong id="read">暂未提供</strong></div><div><span>写入</span><strong id="write">暂未提供</strong></div></div><p class="caption">设备与分区单独计量，不合计重复流量。</p></details>
    <details id="device"><summary>设备信息</summary><dl><dt>主机名</dt><dd id="hostname">正在读取</dd><dt>系统</dt><dd id="system">正在读取</dd><dt>处理器</dt><dd id="model">正在读取</dd><dt>逻辑核心</dt><dd id="cores">正在读取</dd></dl><p id="identity-age" class="caption"></p></details>
    <details id="collection"><summary>采集详情</summary><p id="collection-note" class="caption"></p><div id="group-details"></div><details id="history-details"><summary>趋势数据</summary><p class="caption">CPU，最近五分钟。采样缺口保留为空。</p><ol id="history-values"></ol></details></details>
  </div><footer id="footer">等待服务器连接</footer>
</main><script src="bridge.js"></script><script src="clipboard-bridge.js"></script><script src="text-menu.js"></script><script src="view.js" type="module"></script></body></html>
