<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoDeck</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        color: #25314b;
        background: #f3f5f9;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main { text-align: center; padding: 2rem; }
      h1 { font-size: 2.5rem; font-weight: 600; letter-spacing: -0.04em; }
      p { color: #586174; }
      @media (prefers-color-scheme: dark) {
        :root { color: #e5e9f2; background: #171b24; }
        p { color: #aab4c7; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello SoDeck</h1>
      <p>从一个简单、能安装的应用开始。</p>
    </main>
  </body>
</html>
