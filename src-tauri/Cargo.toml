[package]
name = "sodeck"
# Internal crate version; the application version lives in tauri.conf.json.
version = "0.0.0"
edition = "2021"
publish = false
default-run = "sodeck"

[features]
test-fixtures = []

[[bin]]
name = "catalog-fixture"
path = "tests/fixtures/catalog.rs"
required-features = ["test-fixtures"]
test = false

[[bin]]
name = "plugin-fixture"
path = "tests/fixtures/plugin.rs"
required-features = ["test-fixtures"]
test = false

[[bin]]
name = "workspace-ui-fixture"
path = "tests/fixtures/workspace_ui.rs"
required-features = ["test-fixtures"]
test = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
semver = "=1.0.28"
sha2 = "=0.10.9"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
tar = { version = "=0.4.46", default-features = false }
flate2 = "=1.1.10"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
rand = "=0.10.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
strip = true
