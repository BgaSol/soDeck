[package]
name = "sodeck"
version = "0.1.3"
edition = "2021"

[lib]
name = "ssh_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-prevent-default = "=6.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "hooks"] }
ssh2 = "0.9"
libssh2-sys = "0.3.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
vt100 = "0.16.2"
vte = "0.15"
unicode-width = "0.2"
rfd = "0.15"
tempfile = "3"
polling = "3"
socket2 = { version = "0.6", features = ["all"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tauri-plugin-updater = "2.14"
semver = "1"

[target.'cfg(unix)'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-prevent-default = { version = "=6.0.1", features = ["platform-windows"] }
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

