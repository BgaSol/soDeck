[package]
name = "sodeck"
# Internal crate version; the application version lives in tauri.conf.json.
version = "0.0.0"
edition = "2021"
publish = false
default-run = "sodeck"

[features]
test-fixtures = ["tauri/test", "windows-sys/Win32_UI_HiDpi", "windows-sys/Win32_UI_Input_KeyboardAndMouse", "windows-sys/Win32_System_Memory"]

[[bin]]
name = "catalog-fixture"
path = "tests/fixtures/catalog.rs"
required-features = ["test-fixtures"]
test = false

[[bin]]
name = "release-upgrade-fixture"
path = "tests/fixtures/release_upgrade.rs"
required-features = ["test-fixtures"]
test = false

[[bin]]
name = "plugin-fixture"
path = "tests/fixtures/plugin.rs"
required-features = ["test-fixtures"]
test = false

[[bin]]
name = "workspace-ui-fixture"
path = "tests/fixtures/workspace_ui.rs"
required-features = ["test-fixtures"]
test = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[[bin]]
name = "native-pointer-fixture"
path = "tests/fixtures/native_pointer.rs"
required-features = ["test-fixtures"]
test = false

[[bin]]
name = "desktop-files-fixture"
path = "tests/fixtures/desktop_files.rs"
required-features = ["test-fixtures"]
test = false

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-prevent-default = { version = "=6.0.1", features = ["platform-windows"] }
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
semver = "=1.0.28"
sha2 = "=0.10.9"
zip = { version = "=9.4.1", default-features = false, features = ["deflate-flate2"] }
tar = { version = "=0.4.46", default-features = false }
flate2 = "=1.1.10"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
socker = "=1.0.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
time = { version = "=0.3.55", default-features = false, features = ["formatting"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
rand = "=0.10.3"
fast-socks5 = "=1.0.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSGeometry"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
gdk = "=0.18.2"
glib = "=0.18.5"

[profile.release]
strip = true
