[package]
name = "sodeck"
# Internal crate version; the application version lives in tauri.conf.json.
version = "0.0.0"
edition = "2021"
publish = false
default-run = "sodeck"

[features]
test-fixtures = []

[[bin]]
name = "plugin-fixture"
path = "tests/fixtures/plugin.rs"
required-features = ["test-fixtures"]
test = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
strip = true
