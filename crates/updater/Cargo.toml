[package]
name = "sodeck-updater"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
ring = "=0.17.14"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "time", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
