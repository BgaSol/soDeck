[package]
name = "sodeck-plugin-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
ring = "=0.17.14"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Storage_FileSystem"] }
