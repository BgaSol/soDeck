[package]
name = "sodeck-desktop"
version = "2.0.0-dev.21"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
sodeck-communication = { path = "../../../crates/communication" }
sodeck-core = { path = "../../../crates/core" }
sodeck-plugin-manager = { path = "../../../crates/plugin-manager" }
sodeck-plugin-host = { path = "../../../crates/plugin-host" }
sodeck-updater = { path = "../../../crates/updater" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tauri = { version = "2", features = ["tray-icon", "devtools", "image-png"] }
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
mime_guess = "2"
percent-encoding = "2"
fs2 = "0.4"
rfd = { version = "0.15", features = ["common-controls-v6"] }
arboard = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
wry = { version = "=0.57.0", default-features = false, features = ["os-webview", "devtools"] }
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3"
ring = "0.17"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
