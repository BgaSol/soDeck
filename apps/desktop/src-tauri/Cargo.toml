[package]
name = "sodeck-desktop"
version = "2.0.0-dev.14"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sodeck-communication = { path = "../../../crates/communication" }
sodeck-core = { path = "../../../crates/core" }
sodeck-plugin-manager = { path = "../../../crates/plugin-manager" }
sodeck-plugin-host = { path = "../../../crates/plugin-host" }
tauri = { version = "2", features = ["tray-icon", "devtools", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
mime_guess = "2"
percent-encoding = "2"
fs2 = "0.4"
rfd = "0.15"
arboard = "3"

[target.'cfg(windows)'.dependencies]
wry = { version = "=0.57.0", default-features = false, features = ["os-webview", "devtools"] }
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3"
