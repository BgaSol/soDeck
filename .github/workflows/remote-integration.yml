name: Verify native remote plugins
on:
  workflow_dispatch:
    inputs:
      core_run_id:
        description: Successful core package run from this commit
        type: string
        required: true
      terminal_run_id:
        description: Successful terminal plugin package run from this commit
        type: string
        required: true
      files_run_id:
        description: Successful files plugin package run from this commit
        type: string
        required: true
      network_run_id:
        description: Optional network-proxy plugin package run from this commit
        type: string
        required: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-x86_64, runner: windows-2025}
          - {name: windows-aarch64, runner: windows-11-arm}
          - {name: linux-x86_64, runner: ubuntu-22.04}
          - {name: linux-aarch64, runner: ubuntu-22.04-arm}
          - {name: macos-aarch64, runner: macos-15}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v5
        with:
          name: SoDeck-${{ matrix.name }}
          run-id: ${{ inputs.core_run_id }}
          github-token: ${{ github.token }}
          path: packages/core
      - uses: actions/download-artifact@v5
        with:
          name: Plugin-terminal-${{ matrix.name }}
          run-id: ${{ inputs.terminal_run_id }}
          github-token: ${{ github.token }}
          path: packages/terminal
      - uses: actions/download-artifact@v5
        with:
          name: Plugin-files-${{ matrix.name }}
          run-id: ${{ inputs.files_run_id }}
          github-token: ${{ github.token }}
          path: packages/files
      - uses: actions/download-artifact@v5
        if: inputs.network_run_id != ''
        with:
          name: Plugin-network-proxy-${{ matrix.name }}
          run-id: ${{ inputs.network_run_id }}
          github-token: ${{ github.token }}
          path: packages/network-proxy
      - name: Install Linux runtime and test server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb dbus-x11 openssh-server
          sudo mkdir -p /run/sshd
      - name: Install Windows test server
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:WINDIR/System32/OpenSSH/sshd.exe")) {
            if ('${{ matrix.name }}' -eq 'windows-aarch64') {
              # Windows ARM FoD provisioning can stall on the hosted runner.
              # Use Microsoft's pinned native portable server only for this test.
              $archive = Join-Path $env:RUNNER_TEMP 'OpenSSH-ARM64.zip'
              Invoke-WebRequest 'https://github.com/PowerShell/Win32-OpenSSH/releases/download/10.4.0.0p1-Preview/OpenSSH-ARM64.zip' -OutFile $archive
              if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'D2B1928225479FEC9E0C938F527FDB5ED676446CCA1BBCC5AF84ACA1F272842E') { throw 'OpenSSH test archive hash mismatch' }
              $directory = Join-Path $env:RUNNER_TEMP 'OpenSSH-test'
              Expand-Archive -LiteralPath $archive -DestinationPath $directory
              $server = (Get-ChildItem $directory -Recurse -Filter sshd.exe | Select-Object -First 1).FullName
              if (-not $server) { throw 'OpenSSH server is missing' }
              "SODECK_SSHD=$server" >> $env:GITHUB_ENV
              # On Windows internal-sftp launches sftp-server.exe through the
              # login shell; a portable directory is not in that user's PATH.
              "SODECK_SFTP_SERVER=$(Join-Path (Split-Path $server) 'sftp-server.exe')" >> $env:GITHUB_ENV
            } else {
              $capability = Get-WindowsCapability -Online -Name 'OpenSSH.Server*' | Select-Object -First 1
              Add-WindowsCapability -Online -Name $capability.Name
            }
          }
      - name: Windows installed package with independent plugins
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($plugin in @('terminal','files')) {
            $archive = Get-ChildItem "packages/$plugin" -Filter '*.zip' | Select-Object -First 1
            tar -xf $archive.FullName -C "packages/$plugin"
          }
          $env:SODECK_TEST_TERMINAL_PLUGIN = (Get-ChildItem packages/terminal -Directory | Select-Object -First 1).FullName
          $env:SODECK_TEST_FILES_PLUGIN = (Get-ChildItem packages/files -Directory | Select-Object -First 1).FullName
          if ('${{ inputs.network_run_id }}' -ne '') {
            $archive = Get-ChildItem packages/network-proxy -Filter '*.zip' | Select-Object -First 1
            tar -xf $archive.FullName -C packages/network-proxy
            if ($LASTEXITCODE -ne 0) { throw 'Network plugin extraction failed' }
            $env:SODECK_TEST_NETWORK_PLUGIN = (Get-ChildItem packages/network-proxy -Directory | Select-Object -First 1).FullName
          }
          $installer = Get-ChildItem packages/core -Filter '*-setup.exe' -Recurse | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'SoDeck-remote'
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -WindowStyle Hidden -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw 'Install failed' }
          node scripts/test-openssh.mjs --packaged "$installDir/sodeck.exe"
      - name: Linux extracted package with independent plugins
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          tar -xzf packages/terminal/*.tar.gz -C packages/terminal
          tar -xzf packages/files/*.tar.gz -C packages/files
          export SODECK_TEST_TERMINAL_PLUGIN="$(find "$PWD/packages/terminal" -mindepth 1 -maxdepth 1 -type d | head -1)"
          export SODECK_TEST_FILES_PLUGIN="$(find "$PWD/packages/files" -mindepth 1 -maxdepth 1 -type d | head -1)"
          if [ -n '${{ inputs.network_run_id }}' ]; then
            tar -xzf packages/network-proxy/*.tar.gz -C packages/network-proxy
            export SODECK_TEST_NETWORK_PLUGIN="$(find "$PWD/packages/network-proxy" -mindepth 1 -maxdepth 1 -type d | head -1)"
          fi
          dpkg-deb -x $(find packages/core -name '*.deb' | head -1) "$RUNNER_TEMP/SoDeck-remote"
          node scripts/test-openssh.mjs --packaged dbus-run-session -- xvfb-run -a "$RUNNER_TEMP/SoDeck-remote/usr/bin/sodeck"
      - name: macOS mounted package with independent plugins
        if: runner.os == 'macOS'
        run: |
          tar -xzf packages/terminal/*.tar.gz -C packages/terminal
          tar -xzf packages/files/*.tar.gz -C packages/files
          export SODECK_TEST_TERMINAL_PLUGIN="$(find "$PWD/packages/terminal" -mindepth 1 -maxdepth 1 -type d | head -1)"
          export SODECK_TEST_FILES_PLUGIN="$(find "$PWD/packages/files" -mindepth 1 -maxdepth 1 -type d | head -1)"
          if [ -n '${{ inputs.network_run_id }}' ]; then
            tar -xzf packages/network-proxy/*.tar.gz -C packages/network-proxy
            export SODECK_TEST_NETWORK_PLUGIN="$(find "$PWD/packages/network-proxy" -mindepth 1 -maxdepth 1 -type d | head -1)"
          fi
          hdiutil attach $(find packages/core -name '*.dmg' | head -1) -nobrowse -readonly -mountpoint "$RUNNER_TEMP/SoDeck-remote"
          trap 'hdiutil detach "$RUNNER_TEMP/SoDeck-remote"' EXIT
          node scripts/test-openssh.mjs --packaged "$RUNNER_TEMP/SoDeck-remote/SoDeck.app/Contents/MacOS/sodeck"
