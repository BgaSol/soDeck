name: Verify native remote plugins
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Verify all platforms or retry one with the same package inputs
        type: choice
        default: all
        options: [all, windows-x86_64, windows-aarch64, linux-x86_64, linux-aarch64, macos-aarch64]
      core_version:
        description: Exact core version (or specify core_run_id)
        type: string
      terminal_version:
        description: Exact terminal version (or specify terminal_run_id)
        type: string
      files_version:
        description: Exact files version (or specify files_run_id)
        type: string
      network_version:
        description: Optional exact network-proxy version
        type: string
      core_run_id:
        description: Optional exact core candidate package run
        type: string
      terminal_run_id:
        description: Optional exact terminal candidate package run
        type: string
      files_run_id:
        description: Optional exact files candidate package run
        type: string
      network_run_id:
        description: Optional exact network-proxy candidate package run
        type: string
      verification_run_id:
        description: Replay an earlier verification snapshot (leave other inputs empty)
        type: string
      desktop_files:
        description: Verify actual native file clipboard with an isolated provider (core 0.20+)
        type: boolean
        default: false
      file_editor:
        description: Run Windows editor UI automation (requires a WebView2 debugging endpoint)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      snapshot_id: ${{ steps.saved.outputs.artifact-id || steps.selection.outputs.snapshot_artifact_id }}
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_INPUTS: ${{ toJSON(inputs) }}
        run: node scripts/resolve-native-inputs.mjs
      - id: saved
        if: steps.selection.outputs.upload_snapshot == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Native-verification-inputs
          path: native-inputs.json
          if-no-files-found: error
          retention-days: 30
  verify:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - id: snapshot
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.resolve.outputs.snapshot_id }}
          merge-multiple: true
      - id: selected
        run: node scripts/prepare-native-packages.mjs platform '${{ matrix.target }}'
      - uses: actions/download-artifact@v5
        id: core_download
        if: steps.selected.outputs.core_kind == 'artifact'
        with:
          artifact-ids: ${{ steps.selected.outputs.core_artifact_id }}
          run-id: ${{ steps.selected.outputs.core_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: packages/core
      - uses: actions/download-artifact@v5
        id: terminal_download
        if: steps.selected.outputs.terminal_kind == 'artifact'
        with:
          artifact-ids: ${{ steps.selected.outputs.terminal_artifact_id }}
          run-id: ${{ steps.selected.outputs.terminal_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: packages/terminal
      - uses: actions/download-artifact@v5
        id: files_download
        if: steps.selected.outputs.files_kind == 'artifact'
        with:
          artifact-ids: ${{ steps.selected.outputs.files_artifact_id }}
          run-id: ${{ steps.selected.outputs.files_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: packages/files
      - uses: actions/download-artifact@v5
        id: network_download
        if: steps.selected.outputs.network_kind == 'artifact'
        with:
          artifact-ids: ${{ steps.selected.outputs.network_artifact_id }}
          run-id: ${{ steps.selected.outputs.network_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: packages/network
      - name: Validate and prepare exact native packages
        id: prepared
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-native-packages.mjs prepare '${{ matrix.target }}'
      - name: Install Linux runtime and test server
        id: linux_runtime
        if: runner.os == 'Linux'
        run: |
          sudo "$(command -v node)" scripts/configure-ubuntu-mirror.mjs
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-0 xvfb dbus-x11 openssh-server
          sudo mkdir -p /run/sshd
      - name: Install Windows test server
        id: windows_runtime
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path "$env:WINDIR/System32/OpenSSH/sshd.exe")) {
            if ('${{ matrix.name }}' -eq 'windows-aarch64') {
              # Windows ARM FoD provisioning can stall on the hosted runner.
              # Use Microsoft's pinned native portable server only for this test.
              $archive = Join-Path $env:RUNNER_TEMP 'OpenSSH-ARM64.zip'
              $env:SODECK_OPENSSH_ARCHIVE = $archive
              node --input-type=module -e "import {nativeGithub} from './scripts/native-github.mjs'; await nativeGithub('PowerShell/Win32-OpenSSH',process.env.GH_TOKEN).download('/releases/assets/645185464',process.env.SODECK_OPENSSH_ARCHIVE,{size:5330882,sha256:'d2b1928225479fec9e0c938f527fdb5ed676446cca1bbcc5af84aca1f272842e'});"
              if ($LASTEXITCODE -ne 0) { throw 'OpenSSH test archive download failed' }
              if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'D2B1928225479FEC9E0C938F527FDB5ED676446CCA1BBCC5AF84ACA1F272842E') { throw 'OpenSSH test archive hash mismatch' }
              $directory = Join-Path $env:RUNNER_TEMP 'OpenSSH-test'
              Expand-Archive -LiteralPath $archive -DestinationPath $directory
              $server = (Get-ChildItem $directory -Recurse -Filter sshd.exe | Select-Object -First 1).FullName
              if (-not $server) { throw 'OpenSSH server is missing' }
              "SODECK_SSHD=$server" >> $env:GITHUB_ENV
              # On Windows internal-sftp launches sftp-server.exe through the
              # login shell; a portable directory is not in that user's PATH.
              "SODECK_SFTP_SERVER=$(Join-Path (Split-Path $server) 'sftp-server.exe')" >> $env:GITHUB_ENV
            } else {
              $capability = Get-WindowsCapability -Online -Name 'OpenSSH.Server*' | Select-Object -First 1
              Add-WindowsCapability -Online -Name $capability.Name
            }
          }
      - name: Install Linux clipboard fixture build dependencies
        if: runner.os == 'Linux' && inputs.desktop_files
        run: sudo apt-get -o Acquire::Retries=2 install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        if: inputs.desktop_files
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: inputs.desktop_files
        with:
          shared-key: check-tests
          workspaces: |
            src-tauri -> target
            plugins/terminal -> target
            plugins/files -> target
            plugins/network-proxy -> target
            plugins/system-status -> target
          save-if: false
      - name: Build native test helpers
        if: inputs.desktop_files
        run: cargo build --manifest-path src-tauri/Cargo.toml --features test-fixtures --bin desktop-files-fixture --bin native-pointer-fixture --target ${{ matrix.target }} --locked
      - name: Windows installed package with independent plugins
        id: windows_test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'SoDeck-remote'
          $installed = Start-Process -FilePath $env:SODECK_CORE_PACKAGE -ArgumentList '/S', "/D=$installDir" -WindowStyle Hidden -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw 'Install failed' }
          node scripts/verify-binary.mjs "$installDir/sodeck.exe" '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'Installed core architecture mismatch' }
          node scripts/test-openssh.mjs --packaged "$installDir/sodeck.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Actual remote package test failed' }
          if ('${{ inputs.desktop_files }}' -eq 'true') {
            node scripts/test-desktop-files-native.mjs 'src-tauri/target/${{ matrix.target }}/debug/desktop-files-fixture.exe' "$installDir/sodeck.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Actual file clipboard test failed' }
          }
      - name: Windows file editor UI automation
        id: file_editor_test
        if: runner.os == 'Windows' && inputs.file_editor
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:SODECK_TEST_FILES_PLUGIN/ui/vendor/editor.js")) { throw 'Select files 0.9.0 or later for editor UI automation' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'File editor test dependencies failed' }
          $installDir = Join-Path $env:RUNNER_TEMP 'SoDeck-remote'
          node scripts/test-openssh.mjs --file-editor-native --packaged "$installDir/sodeck.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Actual file editor test failed' }
      - name: Linux extracted package with independent plugins
        id: linux_test
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          dpkg-deb -x "$SODECK_CORE_PACKAGE" "$RUNNER_TEMP/SoDeck-remote"
          node scripts/verify-binary.mjs "$RUNNER_TEMP/SoDeck-remote/usr/bin/sodeck" '${{ matrix.target }}'
          node scripts/test-openssh.mjs --packaged dbus-run-session -- xvfb-run -a "$RUNNER_TEMP/SoDeck-remote/usr/bin/sodeck"
          if [ '${{ inputs.desktop_files }}' = 'true' ]; then
            dbus-run-session -- xvfb-run -a node scripts/test-desktop-files-native.mjs 'src-tauri/target/${{ matrix.target }}/debug/desktop-files-fixture' "$RUNNER_TEMP/SoDeck-remote/usr/bin/sodeck"
          fi
      - name: macOS mounted package with independent plugins
        id: macos_test
        if: runner.os == 'macOS'
        run: |
          hdiutil attach "$SODECK_CORE_PACKAGE" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/SoDeck-remote"
          trap 'hdiutil detach "$RUNNER_TEMP/SoDeck-remote"' EXIT
          node scripts/verify-binary.mjs "$RUNNER_TEMP/SoDeck-remote/SoDeck.app/Contents/MacOS/sodeck" '${{ matrix.target }}'
          node scripts/test-openssh.mjs --packaged "$RUNNER_TEMP/SoDeck-remote/SoDeck.app/Contents/MacOS/sodeck"
          if [ '${{ inputs.desktop_files }}' = 'true' ]; then
            node scripts/test-desktop-files-native.mjs 'src-tauri/target/${{ matrix.target }}/debug/desktop-files-fixture' "$RUNNER_TEMP/SoDeck-remote/SoDeck.app/Contents/MacOS/sodeck"
          fi
      - name: Record platform outcome
        if: always()
        env:
          NATIVE_JOB_STATUS: ${{ job.status }}
          NATIVE_STEPS: ${{ toJSON(steps) }}
          NATIVE_DESKTOP_FILES: ${{ inputs.desktop_files }}
        run: node scripts/native-results.mjs record '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Native-verification-result-${{ matrix.name }}
          path: |
            native-result-${{ matrix.name }}.json
            artifacts/files-ui/native-editor.json
            artifacts/files-ui/native-editor-failure.json
            artifacts/files-ui/editor-native.png
            artifacts/native-desktop-files/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  summary:
    needs: [resolve, verify]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v5
        if: needs.resolve.result == 'success'
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.resolve.outputs.snapshot_id }}
          merge-multiple: true
      - uses: actions/download-artifact@v5
        if: needs.resolve.result == 'success'
        continue-on-error: true
        with:
          pattern: Native-verification-result-*
          merge-multiple: true
          path: native-results
      - name: Summarize selected platform results
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_PLATFORM: ${{ inputs.platform || 'all' }}
        run: node scripts/native-results.mjs summary
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Native-verification-summary
          path: native-summary.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
