name: Verify published release upgrade

on:
  workflow_dispatch:
    inputs:
      platform:
        description: All native platforms or one platform for a fixed version-pair retry
        type: choice
        default: all
        options: [all, windows-x86_64, windows-aarch64, linux-x86_64, linux-aarch64, macos-aarch64]
      component:
        type: choice
        options: [core, terminal, files, network-proxy, system-status, docker]
        required: true
      from_version:
        type: string
        required: true
      to_version:
        type: string
        required: true
      core_version:
        description: Fixed host version for a plugin upgrade
        type: string
      verify_discovery:
        description: Verify production tag discovery selects to_version as the current latest
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - id: platforms
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import {verificationMatrix} from "./scripts/resolve-native-inputs.mjs"; fs.appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify(verificationMatrix(process.env.PLATFORM || "all")) + "\n");'
  upgrade:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Install native Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo "$(command -v node)" scripts/configure-ubuntu-mirror.mjs
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf xvfb dbus-x11 libfuse2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: check-tests
          workspaces: src-tauri -> target
          save-if: false
      - run: npm ci
      - run: npm run check
      - name: Build the verification fixture
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --features test-fixtures --bin release-upgrade-fixture --locked
      - name: Upgrade real published core and plugin packages
        env:
          GH_TOKEN: ${{ github.token }}
          SODECK_UPGRADE_TARGET: ${{ matrix.target }}
          SODECK_UPGRADE_COMPONENT: ${{ inputs.component }}
          SODECK_UPGRADE_FROM: ${{ inputs.from_version }}
          SODECK_UPGRADE_TO: ${{ inputs.to_version }}
          SODECK_UPGRADE_CORE: ${{ inputs.core_version }}
          SODECK_UPGRADE_DISCOVERY: ${{ inputs.verify_discovery || false }}
        run: node scripts/test-release-upgrade.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Release-upgrade-${{ matrix.name }}
          path: artifacts/release-upgrade/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
