name: Verify published release upgrade

on:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [core, terminal, files, network-proxy, system-status, docker]
        required: true
      from_version:
        type: string
        required: true
      to_version:
        type: string
        required: true
      core_version:
        description: Fixed host version for a plugin upgrade
        type: string

permissions:
  contents: read

jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-x86_64, runner: windows-2025, target: x86_64-pc-windows-msvc}
          - {name: windows-aarch64, runner: windows-11-arm, target: aarch64-pc-windows-msvc}
          - {name: linux-x86_64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu}
          - {name: linux-aarch64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu}
          - {name: macos-aarch64, runner: macos-15, target: aarch64-apple-darwin}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Install native Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo "$(command -v node)" scripts/configure-ubuntu-mirror.mjs
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf xvfb dbus-x11 libfuse2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: check-tests
          workspaces: src-tauri -> target
          save-if: false
      - run: npm ci
      - run: npm run check
      - name: Build the verification fixture
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --features test-fixtures --bin release-upgrade-fixture --locked
      - name: Upgrade real published core and plugin packages
        env:
          GH_TOKEN: ${{ github.token }}
          SODECK_UPGRADE_TARGET: ${{ matrix.target }}
          SODECK_UPGRADE_COMPONENT: ${{ inputs.component }}
          SODECK_UPGRADE_FROM: ${{ inputs.from_version }}
          SODECK_UPGRADE_TO: ${{ inputs.to_version }}
          SODECK_UPGRADE_CORE: ${{ inputs.core_version }}
        run: node scripts/test-release-upgrade.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Release-upgrade-${{ matrix.name }}
          path: artifacts/release-upgrade/
          if-no-files-found: warn
          retention-days: 30
