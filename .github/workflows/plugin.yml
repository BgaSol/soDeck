name: Temporary cache boundary probe
on:
  workflow_dispatch:
    inputs:
      plugin:
        type: string
        default: terminal
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Base core
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: core-package
          workspaces: src-tauri -> target
          lookup-only: true
          save-if: false
      - name: Base terminal
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: plugin-terminal
          key: ${{ hashFiles('crates/plugin-client/Cargo.toml') }}
          workspaces: plugins/terminal -> target
          lookup-only: true
          save-if: false
      - name: Change unrelated files plugin profile
        run: printf '\n[profile.dev]\ndebug = 1\n' >> plugins/files/Cargo.toml
      - name: Unrelated change core
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: core-package
          workspaces: src-tauri -> target
          lookup-only: true
          save-if: false
      - name: Unrelated change terminal
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: plugin-terminal
          key: ${{ hashFiles('crates/plugin-client/Cargo.toml') }}
          workspaces: plugins/terminal -> target
          lookup-only: true
          save-if: false
      - name: Change shared client manifest
        run: printf '\n[features]\ncache_probe = []\n' >> crates/plugin-client/Cargo.toml
      - name: Shared change core
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: core-package
          workspaces: src-tauri -> target
          lookup-only: true
          save-if: false
      - name: Shared change terminal
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: plugin-terminal
          key: ${{ hashFiles('crates/plugin-client/Cargo.toml') }}
          workspaces: plugins/terminal -> target
          lookup-only: true
          save-if: false
      - name: Change terminal compile profile
        run: printf '\n[profile.dev]\ndebug = 1\n' >> plugins/terminal/Cargo.toml
      - name: Profile change terminal
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: plugin-terminal
          key: ${{ hashFiles('crates/plugin-client/Cargo.toml') }}
          workspaces: plugins/terminal -> target
          lookup-only: true
          save-if: false
      - name: Environment change terminal
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        env:
          RUSTFLAGS: -C debuginfo=1
        with:
          shared-key: plugin-terminal
          key: ${{ hashFiles('crates/plugin-client/Cargo.toml') }}
          workspaces: plugins/terminal -> target
          lookup-only: true
          save-if: false
