name: Package plugin

on:
  push:
    tags: ["plugin-*-v*"]
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin directory under plugins/
        default: terminal
        required: true
        type: string
      publish:
        description: Create a draft independent plugin Release
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      plugin: ${{ steps.config.outputs.plugin }}
      tag: ${{ steps.config.outputs.tag }}
      publish: ${{ steps.config.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - id: config
        env:
          PLUGIN: ${{ inputs.plugin || 'terminal' }}
          PLUGIN_PUBLISH: ${{ inputs.publish || false }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/plugin-release.mjs preflight "$PLUGIN"
  package:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        if: needs.select.outputs.plugin != 'terminal'
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/file-editor/package-lock.json
      - uses: actions/setup-node@v6
        if: needs.select.outputs.plugin == 'terminal'
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/terminal/package-lock.json
            packages/file-editor/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        env:
          SODECK_PLUGIN_CLIENT_MANIFEST_HASH: ${{ hashFiles('crates/plugin-client/Cargo.toml') }}
        with:
          shared-key: plugin-${{ needs.select.outputs.plugin }}
          env-vars: SODECK_PLUGIN_CLIENT_MANIFEST_HASH
          workspaces: plugins/${{ needs.select.outputs.plugin }} -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - shell: bash
        env:
          PLUGIN: ${{ needs.select.outputs.plugin }}
        run: node scripts/package-plugin.mjs --plugin "$PLUGIN" --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: Plugin-${{ needs.select.outputs.plugin }}-${{ matrix.name }}
          path: |
            artifacts/plugins/*.zip
            artifacts/plugins/*.tar.gz
            artifacts/plugins/plugin-*.json
          if-no-files-found: error
          retention-days: 30
  verify:
    needs: [select, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
    name: verify-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v5
        with:
          name: Plugin-${{ needs.select.outputs.plugin }}-${{ matrix.name }}
          path: packages/plugin
      - name: Verify actual native plugin archive
        run: node scripts/test-plugin-package.mjs packages/plugin '${{ matrix.target }}' '${{ github.sha }}' '${{ needs.select.outputs.plugin }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Plugin-verification-${{ needs.select.outputs.plugin }}-${{ matrix.name }}
          path: artifacts/verification/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  release:
    needs: [select, verify]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    concurrency:
      group: plugin-release-${{ needs.select.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v5
        with:
          pattern: Plugin-${{ needs.select.outputs.plugin }}-*
          merge-multiple: true
          path: artifacts/plugins
      - uses: actions/download-artifact@v5
        with:
          pattern: Plugin-verification-${{ needs.select.outputs.plugin }}-*
          merge-multiple: true
          path: verification
      - name: Bind results to the package bytes
        run: node scripts/verification-report.mjs '${{ needs.select.outputs.plugin }}' artifacts/plugins verification '${{ github.sha }}'
      - name: Prepare optional plugin draft
        env:
          PLUGIN: ${{ needs.select.outputs.plugin }}
          PLUGIN_PUBLISH: ${{ needs.select.outputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/plugin-release.mjs prepare "$PLUGIN" artifacts/plugins
      - uses: actions/upload-artifact@v7
        with:
          name: Plugin-update-manifest-${{ needs.select.outputs.plugin }}
          path: artifacts/plugins/plugin-update.json
          if-no-files-found: error
          retention-days: 30
