name: Package plugin

on:
  push:
    tags: ["plugin-*-v*"]
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin directory under plugins/
        default: terminal
        required: true
        type: string
      publish:
        description: Create a draft independent plugin Release
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      plugin: ${{ steps.config.outputs.plugin }}
      tag: ${{ steps.config.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - id: config
        env:
          PLUGIN: ${{ inputs.plugin || 'terminal' }}
        run: node scripts/release-metadata.mjs --kind plugin --plugin "$PLUGIN"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt
      - env:
          PLUGIN: ${{ steps.config.outputs.plugin }}
        run: cargo fmt --manifest-path "plugins/$PLUGIN/Cargo.toml" -- --check
  package:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/${{ needs.select.outputs.plugin }} -> target
      - shell: bash
        env:
          PLUGIN: ${{ needs.select.outputs.plugin }}
        run: |
          node scripts/package-plugin.mjs --plugin "$PLUGIN" --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-${{ needs.select.outputs.plugin }}-${{ matrix.name }}
          path: |
            artifacts/plugins/*.zip
            artifacts/plugins/*.tar.gz
            artifacts/plugins/plugin-*.json
          if-no-files-found: error
  release:
    needs: [select, package]
    if: always() && !cancelled() && needs.select.result == 'success' && (startsWith(github.ref, 'refs/tags/') || inputs.publish)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    concurrency:
      group: plugin-release-${{ needs.select.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v5
        with:
          pattern: Plugin-${{ needs.select.outputs.plugin }}-*
          merge-multiple: true
          path: artifacts/plugins
      - env:
          PLUGIN: ${{ needs.select.outputs.plugin }}
          TAG: ${{ needs.select.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-metadata.mjs --kind plugin --plugin "$PLUGIN" --tag "$TAG" --input artifacts/plugins
          if gh release view "$TAG" --json isDraft > release.json; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release.json")).isDraft) throw new Error("Published versions are immutable; bump the version")'
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --latest=false --title "$PLUGIN ${TAG##*-v}" --notes-file "plugins/$PLUGIN/CHANGELOG.md"
          fi
          find artifacts/plugins -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name 'plugin-update.json' \) -exec gh release upload "$TAG" --clobber {} +
