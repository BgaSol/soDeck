name: Package Hello plugin

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Release tag to attach packages to (empty for Artifacts only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/hello -> target
      - run: node scripts/package-plugin.mjs --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Hello-${{ matrix.name }}
          path: |
            artifacts/plugins/*.zip
            artifacts/plugins/*.tar.gz
          if-no-files-found: error
      - name: Attach to an existing Release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" artifacts/plugins/*.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }} --clobber
