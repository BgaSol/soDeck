name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/terminal/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run plugin:check
      - run: cargo fmt --manifest-path crates/plugin-client/Cargo.toml -- --check
      - run: npm run web:build
      - run: npm run scripts:test
      - name: Install core fixture build dependencies
        run: |
          sudo sed -E -i 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        env:
          SODECK_PLUGIN_CLIENT_MANIFEST_HASH: ${{ hashFiles('crates/plugin-client/Cargo.toml') }}
        with:
          shared-key: check-tests
          env-vars: SODECK_PLUGIN_CLIENT_MANIFEST_HASH
          workspaces: |
            src-tauri -> target
            plugins/network-proxy -> target
            plugins/files -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm run test
      - run: cargo test --manifest-path plugins/network-proxy/Cargo.toml --locked
      - run: cargo test --manifest-path plugins/files/Cargo.toml --locked
      - run: npx playwright install --with-deps chromium
      - run: npm run interactions:test
      - run: npm run terminal:input:test
      - run: npm run settings:test
