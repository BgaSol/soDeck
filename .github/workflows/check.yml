# Temporary PR cache comparison; do not merge this workflow configuration.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/terminal/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run plugin:check
      - run: cargo fmt --manifest-path crates/plugin-client/Cargo.toml -- --check
      - run: npm run web:build
      - run: npm run scripts:test
      - name: Install core fixture build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: phase2-check-debug
          workspaces: |
            src-tauri -> target
            plugins/network-proxy -> target
            plugins/files -> target
          cache-targets: true
          save-if: true
      - run: npm run test
      - run: cargo test --manifest-path plugins/network-proxy/Cargo.toml --locked
      - run: cargo test --manifest-path plugins/files/Cargo.toml --locked
      - run: npx playwright install --with-deps chromium
      - run: npm run interactions:test
      - run: npm run terminal:input:test
      - run: npm run settings:test
