name: Desktop checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - run: npm ci
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Real OpenSSH and rsync transfer tests
        if: runner.os == 'Linux'
        run: |
          docker build -t ssh-workspace-rsync-fixture tests/rsync
          python3 tests/rsync/environment.py
          cargo test --manifest-path src-tauri/Cargo.toml --lib rsync_ -- --ignored --test-threads=1
      - name: Remove transfer test servers
        if: always() && runner.os == 'Linux'
        run: |
          if [ -f .qa/rsync-environment.json ]; then python3 tests/rsync/environment.py stop; fi
      - run: npm run tauri -- build --no-bundle
