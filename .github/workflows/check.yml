name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Checks on the selected ref (all excludes netem)
        type: choice
        default: standard
        options: [standard, desktop, native-core, network-plugin, all, netem]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.suite || 'automatic' }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      native_matrix: ${{ steps.scope.outputs.native_matrix }}
      integration_matrix: ${{ steps.scope.outputs.integration_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - id: scope
        run: node scripts/select-checks.mjs
      - name: Check documentation structure and local file links
        run: node scripts/check-docs.mjs
      - name: Lint GitHub Actions workflows
        if: fromJSON(steps.scope.outputs.plan).workflow
        shell: bash
        run: |
          lint_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$lint_dir"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$lint_dir/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt -o "$lint_dir/checksums.txt"
          (cd "$lint_dir" && grep ' actionlint_1.7.12_linux_amd64.tar.gz$' checksums.txt | sha256sum --check --strict)
          tar -xzf "$lint_dir/actionlint_1.7.12_linux_amd64.tar.gz" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -color

  checks:
    needs: select
    if: fromJSON(needs.select.outputs.plan).checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CHECK_PLAN: ${{ needs.select.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/terminal/package-lock.json
      - run: npm ci
      - name: Format affected Rust components
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const p = JSON.parse(process.env.CHECK_PLAN);
          const manifests = [p.core && 'src-tauri/Cargo.toml', p.sharedClient && 'crates/plugin-client/Cargo.toml', ...p.plugins.map(name => 'plugins/' + name + '/Cargo.toml')].filter(Boolean);
          for (const manifest of manifests) {
            const result = spawnSync('cargo', ['fmt', '--manifest-path', manifest, '--', '--check'], { stdio: 'inherit' });
            if (result.status !== 0) process.exit(result.status || 1);
          }
          NODE
      - run: npm run scripts:test
        if: fromJSON(needs.select.outputs.plan).scripts

  browser:
    needs: select
    if: fromJSON(needs.select.outputs.plan).browser
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/terminal/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Install core-backed browser fixture dependencies
        if: fromJSON(needs.select.outputs.plan).web
        run: |
          sudo "$(command -v node)" scripts/configure-ubuntu-mirror.mjs
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: fromJSON(needs.select.outputs.plan).web
        env:
          SODECK_PLUGIN_CLIENT_MANIFEST_HASH: ${{ hashFiles('crates/plugin-client/Cargo.toml') }}
        with:
          shared-key: check-tests
          env-vars: SODECK_PLUGIN_CLIENT_MANIFEST_HASH
          workspaces: |
            src-tauri -> target
            plugins/terminal -> target
            plugins/files -> target
            plugins/network-proxy -> target
            plugins/system-status -> target
            plugins/docker -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Configure Ubuntu browser dependency mirror
        run: sudo "$(command -v node)" scripts/configure-ubuntu-mirror.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run ci:test -- ui:test
        if: fromJSON(needs.select.outputs.plan).web
      - run: npm run ci:test -- terminal:input:test
        if: fromJSON(needs.select.outputs.plan).terminalInput
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-diagnostics
          path: |
            artifacts/ci/
            artifacts/menu-layout/
            artifacts/workbench-design/
            artifacts/workbench-layout/
            artifacts/desktop-ui/
            artifacts/settings-ui/
            artifacts/production-ui/
            artifacts/workspace-ui.png
          if-no-files-found: warn
          retention-days: 14

  network:
    needs: select
    if: fromJSON(needs.select.outputs.plan).integration[0] != null
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.select.outputs.integration_matrix) }}
    name: integration-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/terminal/package-lock.json
      - name: Install native fixture and OpenSSH dependencies
        run: |
          sudo "$(command -v node)" scripts/configure-ubuntu-mirror.mjs
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf cmake openssh-server zsh
          sudo mkdir -p /run/sshd
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        env:
          SODECK_PLUGIN_CLIENT_MANIFEST_HASH: ${{ hashFiles('crates/plugin-client/Cargo.toml') }}
        with:
          shared-key: network-tests
          env-vars: SODECK_PLUGIN_CLIENT_MANIFEST_HASH
          workspaces: |
            src-tauri -> target
            plugins/network-proxy -> target
            plugins/files -> target
            plugins/terminal -> target
            plugins/system-status -> target
            plugins/docker -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Real network plugin, independent SOCKS server and curl
        if: matrix.network
        run: npm run ci:test -- network:test
      - name: Real files plugin and SFTP
        if: matrix.files
        run: npm run ci:test -- files:test
      - name: Real terminal plugin and PTY
        if: matrix.terminal
        run: npm run ci:test -- terminal:test
      - name: Automatic Bash and Zsh startup in real PTYs
        if: matrix.terminal
        run: python3 scripts/test-terminal-shell.py
      - name: Real system status plugin and background sampling
        if: matrix.status
        run: npm run ci:test -- system-status:test
      - name: Actual Docker plugin with isolated Engine and OpenSSH
        if: matrix.docker
        run: npm run ci:test -- docker:test
      - name: Docker UI and actual native archive
        if: matrix.docker
        run: npm run ci:test -- docker:ui:test && npm run ci:test -- docker:package:test
      - name: Three real plugins and shared state communication
        if: matrix.communication
        run: npm run ci:test -- communication:test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-diagnostics-${{ matrix.name }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14

  desktop:
    needs: select
    if: fromJSON(needs.select.outputs.plan).desktop
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/terminal/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        env:
          SODECK_PLUGIN_CLIENT_MANIFEST_HASH: ${{ hashFiles('crates/plugin-client/Cargo.toml') }}
        with:
          shared-key: check-tests
          env-vars: SODECK_PLUGIN_CLIENT_MANIFEST_HASH
          workspaces: |
            src-tauri -> target
            plugins/terminal -> target
            plugins/files -> target
            plugins/network-proxy -> target
            plugins/system-status -> target
            plugins/docker -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Install OpenSSH test server
        if: fromJSON(needs.select.outputs.plan).ssh
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:WINDIR/System32/OpenSSH/sshd.exe")) {
            $capability = Get-WindowsCapability -Online -Name 'OpenSSH.Server*' | Select-Object -First 1
            if (-not $capability) { throw 'OpenSSH Server capability is unavailable' }
            Add-WindowsCapability -Online -Name $capability.Name
          }
      - run: npm run ci:test -- ssh:test
        if: fromJSON(needs.select.outputs.plan).ssh
      - run: npx playwright install chromium
        if: fromJSON(needs.select.outputs.plan).windowsUi
      - run: npm run ci:test -- ui:test
        if: fromJSON(needs.select.outputs.plan).windowsUi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-desktop-diagnostics
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14

  native:
    needs: select
    if: fromJSON(needs.select.outputs.plan).native[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.native_matrix) }}
    name: native-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Verify native Rust host
        env:
          EXPECTED_RUST_TARGET: ${{ matrix.target }}
        run: |
          node -e "const {spawnSync}=require('node:child_process'); const host=spawnSync('rustc',['-vV'],{encoding:'utf8'}).stdout.match(/^host: (.+)$/m)?.[1]; if(host!==process.env.EXPECTED_RUST_TARGET) throw new Error('Native Rust host mismatch: '+host)"
      - name: Install core fixture build dependencies
        if: runner.os == 'Linux' && matrix.core
        run: |
          sudo "$(command -v node)" scripts/configure-ubuntu-mirror.mjs
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        env:
          SODECK_PLUGIN_CLIENT_MANIFEST_HASH: ${{ hashFiles('crates/plugin-client/Cargo.toml') }}
        with:
          shared-key: check-tests
          env-vars: SODECK_PLUGIN_CLIENT_MANIFEST_HASH
          workspaces: ${{ matrix.workspaces }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
        if: matrix.core || matrix.scripts
      - name: Verify macOS default-handler fixture
        if: runner.os == 'macOS' && matrix.core
        run: node scripts/test-desktop-open-native.mjs --handler-only
      - name: Native core source tests
        if: matrix.core
        run: npm run test
      - name: Scripts on native host
        if: matrix.scripts
        run: node --test scripts/collect-core.test.mjs scripts/core-release.test.mjs scripts/plugin-settings-assets.test.mjs scripts/release-metadata.test.mjs scripts/smoke.test.mjs
      - name: Native network plugin source tests
        if: matrix.network
        run: cargo test --manifest-path plugins/network-proxy/Cargo.toml --locked
      - name: Native files plugin source tests
        if: matrix.files
        run: cargo test --manifest-path plugins/files/Cargo.toml --locked
      - name: Native terminal plugin source tests
        if: matrix.terminal
        run: cargo test --manifest-path plugins/terminal/Cargo.toml --locked
      - name: Native system status plugin source tests
        if: matrix.status
        run: cargo test --manifest-path plugins/system-status/Cargo.toml --locked
      - name: Native Docker plugin source tests
        if: matrix.docker
        run: cargo test --manifest-path plugins/docker/Cargo.toml --locked

  netem:
    needs: select
    if: github.event_name == 'workflow_dispatch' && fromJSON(needs.select.outputs.plan).netem
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install native fixture and namespace dependencies
        run: |
          sudo "$(command -v node)" scripts/configure-ubuntu-mirror.mjs
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf iproute2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        env:
          SODECK_PLUGIN_CLIENT_MANIFEST_HASH: ${{ hashFiles('crates/plugin-client/Cargo.toml') }}
        with:
          shared-key: network-tests
          env-vars: SODECK_PLUGIN_CLIENT_MANIFEST_HASH
          workspaces: |
            src-tauri -> target
            plugins/network-proxy -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Private namespace packet loss and recovery
        run: npm run network:netem
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: network-netem-${{ matrix.runner }}
          path: artifacts/network-netem/report.json
          if-no-files-found: warn
          retention-days: 14

  # Preserve the existing common status name for branch protection.
  format:
    needs: [select, checks, browser, network, desktop, native, netem]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Report executed and skipped checks; reject failed or missing selected jobs
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/select-checks.mjs report
