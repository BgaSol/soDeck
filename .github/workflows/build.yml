name: Package SoDeck
run-name: "${{ inputs.core_run_id && format('Reuse core #{0}', inputs.core_run_id) || format('Package core from {0}', github.ref_name) }} · ${{ (inputs.publish || github.ref_type == 'tag') && 'draft' || 'Artifacts' }}"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Prepare a core Release draft after package verification
        type: boolean
        default: false
      core_run_id:
        description: Original package run ID; reuse its verified Artifacts and skip all builds
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.config.outputs.tag }}
      version: ${{ steps.config.outputs.version }}
      publish: ${{ steps.config.outputs.publish }}
      source_sha: ${{ steps.config.outputs.source_sha }}
      run_id: ${{ steps.config.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - id: config
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_PUBLISH: ${{ inputs.publish || false }}
          CORE_RUN_ID: ${{ inputs.core_run_id }}
        run: node scripts/core-release.mjs preflight
  package:
    needs: preflight
    if: ${{ !inputs.core_run_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - name: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: nsis
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: deb,appimage
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg,app
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo "$(command -v node)" scripts/configure-ubuntu-mirror.mjs
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf libfuse2 xdg-utils desktop-file-utils
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: core-release-v2
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Build installer
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          uploadUpdaterJson: false
          args: --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - name: Collect built packages
        run: node scripts/collect-core.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: SoDeck-${{ matrix.name }}
          path: artifacts/core/
          if-no-files-found: error
          retention-days: 30
  verify:
    needs: [preflight, package]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.package.result == 'success' || (inputs.core_run_id != '' && needs.package.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - name: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: nsis
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: deb,appimage
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg,app
    name: verify-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install Linux runtime verification dependencies
        if: runner.os == 'Linux'
        run: |
          sudo "$(command -v node)" scripts/configure-ubuntu-mirror.mjs
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::Retries=2 install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 xvfb dbus-x11 libfuse2
      - uses: actions/download-artifact@v5
        with:
          name: SoDeck-${{ matrix.name }}
          run-id: ${{ needs.preflight.outputs.run_id }}
          github-token: ${{ github.token }}
          path: packages/core
      - name: Verify actual native packages
        run: node scripts/test-core-package.mjs packages/core '${{ matrix.target }}' '${{ needs.preflight.outputs.source_sha }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Core-verification-${{ matrix.name }}
          path: artifacts/verification/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  metadata:
    needs: [preflight, verify]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    concurrency:
      group: core-release-${{ needs.preflight.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v5
        with:
          pattern: SoDeck-*
          run-id: ${{ needs.preflight.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: artifacts/core
      - uses: actions/download-artifact@v5
        with:
          pattern: Core-verification-*
          merge-multiple: true
          path: verification
      - name: Bind results to the original package bytes
        run: node scripts/verification-report.mjs core artifacts/core verification '${{ needs.preflight.outputs.source_sha }}'
      - name: Prepare verified manifest and optional draft
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_PUBLISH: ${{ needs.preflight.outputs.publish }}
          CORE_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          CORE_RUN_ID: ${{ needs.preflight.outputs.run_id }}
        run: node scripts/core-release.mjs prepare artifacts/core
      - uses: actions/upload-artifact@v7
        with:
          name: Core-update-manifest
          path: artifacts/core/core-update.json
          if-no-files-found: error
          retention-days: 30
