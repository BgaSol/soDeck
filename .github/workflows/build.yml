name: Package SoDeck
run-name: "${{ inputs.core_run_id && format('Reuse core #{0}', inputs.core_run_id) || format('Package core from {0}', github.ref_name) }} · ${{ (inputs.publish || github.ref_type == 'tag') && 'draft' || 'Artifacts' }}"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Prepare a core Release draft after package verification
        type: boolean
        default: false
      core_run_id:
        description: Original package run ID; reuse its verified Artifacts and skip all builds
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.config.outputs.tag }}
      version: ${{ steps.config.outputs.version }}
      publish: ${{ steps.config.outputs.publish }}
      source_sha: ${{ steps.config.outputs.source_sha }}
      run_id: ${{ steps.config.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - id: config
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_PUBLISH: ${{ inputs.publish || false }}
          CORE_RUN_ID: ${{ inputs.core_run_id }}
        run: node scripts/core-release.mjs preflight
  package:
    needs: preflight
    if: ${{ !inputs.core_run_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - name: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: nsis
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: deb,appimage
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg,app
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo "$(command -v node)" scripts/configure-ubuntu-mirror.mjs
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf xvfb dbus-x11 libfuse2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: core-release-v2
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Install OpenSSH for packaged SSH verification
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:WINDIR/System32/OpenSSH/sshd.exe")) {
            $capability = Get-WindowsCapability -Online -Name 'OpenSSH.Server*' | Select-Object -First 1
            if (-not $capability) { throw 'OpenSSH Server capability is unavailable' }
            Add-WindowsCapability -Online -Name $capability.Name
          }
      - name: Build installer
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          uploadUpdaterJson: false
          args: --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - name: Install and launch Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          $installDir = Join-Path $env:ProgramW6432 'SoDeck'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -WindowStyle Hidden -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $registration = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\SoDeck'
          if ($registration.InstallLocation.Trim('"') -ne $installDir) { throw 'System installation location mismatch' }
          node scripts/verify-binary.mjs "$installDir/sodeck.exe" '${{ matrix.target }}'
          $env:SODECK_TEST_UPDATE_BUNDLE = $installer.FullName
          node scripts/smoke.mjs "$installDir/sodeck.exe"
          if ('${{ matrix.name }}' -eq 'windows-x86_64') { node scripts/test-openssh.mjs --packaged "$installDir/sodeck.exe" }
      - name: Extract and launch Linux package
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          dpkg-deb -x src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb "$RUNNER_TEMP/SoDeck"
          node scripts/verify-binary.mjs "$RUNNER_TEMP/SoDeck/usr/bin/sodeck" '${{ matrix.target }}'
          export SODECK_TEST_UPDATE_BUNDLE="$(find src-tauri/target/${{ matrix.target }}/release/bundle/appimage -name '*.AppImage' | head -1)"
          test -n "$SODECK_TEST_UPDATE_BUNDLE"
          node scripts/smoke.mjs dbus-run-session -- xvfb-run -a "$RUNNER_TEMP/SoDeck/usr/bin/sodeck"
          APPIMAGE_EXTRACT_AND_RUN=1 node scripts/smoke.mjs dbus-run-session -- xvfb-run -a src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
      - name: Mount and launch macOS package
        if: runner.os == 'macOS'
        run: |
          hdiutil attach src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/SoDeck"
          trap 'hdiutil detach "$RUNNER_TEMP/SoDeck"' EXIT
          node scripts/verify-binary.mjs "$RUNNER_TEMP/SoDeck/SoDeck.app/Contents/MacOS/sodeck" '${{ matrix.target }}'
          export SODECK_TEST_UPDATE_BUNDLE="$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -name '*.app.tar.gz' | head -1)"
          test -n "$SODECK_TEST_UPDATE_BUNDLE"
          node scripts/smoke.mjs "$RUNNER_TEMP/SoDeck/SoDeck.app/Contents/MacOS/sodeck"
      - name: Collect verified packages
        run: node scripts/collect-core.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: SoDeck-${{ matrix.name }}
          path: artifacts/core/
          if-no-files-found: error
          retention-days: 30
  metadata:
    needs: [preflight, package]
    if: always() && !cancelled() && needs.preflight.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    concurrency:
      group: core-release-${{ needs.preflight.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v5
        with:
          pattern: SoDeck-*
          run-id: ${{ needs.preflight.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: artifacts/core
      - name: Prepare verified manifest and optional draft
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_PUBLISH: ${{ needs.preflight.outputs.publish }}
          CORE_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          CORE_RUN_ID: ${{ needs.preflight.outputs.run_id }}
        run: node scripts/core-release.mjs prepare artifacts/core
      - uses: actions/upload-artifact@v7
        with:
          name: Core-update-manifest
          path: artifacts/core/core-update.json
          if-no-files-found: error
          retention-days: 30
