[package]
name = "sodeck-update-probe"
version = "0.1.0"
edition = "2021"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
fs2 = "0.4"
